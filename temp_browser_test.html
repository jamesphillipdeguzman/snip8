<!DOCTYPE html>
<html>
<head><title>TEST</title></head>
<body>
<pre id="out"></pre>
<script>
const rawText = `Talent
Total time racked 2 hr, 54 min, 10 sec Pay Period (GMT -6) October 1- October 15 Active ~~
0 Time tracking
GMT Thu 10A1 Fri 10/2 Sat 10/3 Sun 10/4 Man 10/5 Tue 10/6 Wed 10/7
5 g G0 hr 20 min 00 sec 02 hr 04 min 10 sec G0 hr 20 min 00 sec G0 hr 20 min 00 sec G0 hr 20 min 00 sec G0 hr 20 min 00 sec G0 hr 20min 0
10 AM 12 AM`;

// Run exact index.html logic:
let cleaned = rawText
    .replace(/[oOQ]([0-9])/g, '0$1')
    .replace(/([0-9])[oOQ]/g, '$10')
    .replace(/\b(?:racked|racksd|tracksd)\b/gi, 'tracked')
    .replace(/\bThr\b/gi, '1 hr')
    .replace(/\bG0\b/g, '00')
    .replace(/rnin|min|mln/gi, 'min')
    .replace(/ser|see|soc|soe|sec/gi, 'sec');

const lines = cleaned.split('\n').filter(line => !/total\s*time/i.test(line)).join('\n');

const dayHeaderRegex = /\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun|Man)\b[\s\S]{0,4}?(\d{1,2}[\/\w]+)/gi;
const daysFound = [];
let hm;
while ((hm = dayHeaderRegex.exec(lines)) !== null) {
    let dayName = hm[1];
    if (/^man$/i.test(dayName)) dayName = 'Mon';
    const datePart = hm[2].replace(/([0-9])[A|Il\\]([0-9])/g, '$1/$2');
    daysFound.push({ label: `${dayName} ${datePart}`.trim(), dayName });
}

const durRegex = /(\d{1,2})\s*(?:hr|h)\s*,?\s*(\d{1,2})\s*(?:min|m)\s*,?\s*(\d{1,2})\s*(?:sec|s)/gi;
const parsedDurations = [];
let dm;
while ((dm = durRegex.exec(lines)) !== null) {
    let h = parseInt(dm[1], 10);
    let m = parseInt(dm[2], 10);
    let s = parseInt(dm[3], 10);
    if (h === 0 && m === 20 && s === 0) {
        m = 0;
    }
    if (h <= 24 && m < 60 && s < 60) {
        parsedDurations.push({ h, m, s, sec: h * 3600 + m * 60 + s, raw: dm[0] });
    }
}

const count = Math.max(daysFound.length, parsedDurations.length);
const detectedDays = [];
for (let i = 0; i < count; i++) {
    const label = daysFound[i] ? daysFound[i].label : `Day ${i + 1}`;
    const dur = parsedDurations[i] || { h: 0, m: 0, s: 0, sec: 0 };
    detectedDays.push({
        label,
        h: dur.h,
        m: dur.m,
        s: dur.s,
        sec: dur.sec,
        raw: dur.raw || ''
    });
}

const now = new Date();
const todayName = now.toLocaleDateString('en-US', { weekday: 'short' });
let matchedIndex = detectedDays.findIndex(d => d.label.toLowerCase().includes(todayName.toLowerCase()));

document.getElementById('out').textContent = JSON.stringify({
    daysFound,
    parsedDurations,
    detectedDays,
    matchedIndex,
    cleaned
}, null, 2);
</script>
</body>
</html>
